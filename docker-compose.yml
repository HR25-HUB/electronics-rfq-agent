services:
  opensearch:
    image: opensearchproject/opensearch:3.8.0
    container_name: rfq-opensearch-dev
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m
    ports:
      - "9200:9200"
      - "9600:9600"
    volumes:
      - rfq_opensearch_data:/usr/share/opensearch/data

volumes:
  rfq_opensearch_data:

# DEV ONLY. Security is disabled for local testing.
# Never use this configuration as production.
