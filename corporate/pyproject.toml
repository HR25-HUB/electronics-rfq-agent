[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "corporate-rfq-product-identity"
version = "0.1.0"
description = "Evidence-backed RFQ Product Identity safety vertical slice"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28",
    "pydantic>=2.7",
]

[project.optional-dependencies]
dev = ["pytest>=8.4", "ruff>=0.9", "pyrefly>=0.30"]

[tool.hatch.build.targets.wheel]
packages = ["src/corporate_rfq"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
