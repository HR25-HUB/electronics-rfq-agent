services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: rfq_test
      POSTGRES_DB: rfq_memory_test
      POSTGRES_PASSWORD: ${RFQ_TEST_DB_PASSWORD:?Set RFQ_TEST_DB_PASSWORD for isolated testing}
    ports:
      - "127.0.0.1:55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rfq_test -d rfq_memory_test"]
      interval: 2s
      timeout: 3s
      retries: 15
    tmpfs:
      - /var/lib/postgresql/data
