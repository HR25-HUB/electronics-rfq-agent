name: Security lock refresh

on:
  push:
    branches:
      - chore/security-baseline-2026-09

jobs:
  refresh-lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: chore/security-baseline-2026-09

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Refresh anyio in lockfile
        run: uv lock --upgrade-package anyio

      - name: Commit refreshed lockfile when changed
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "chore: refresh anyio lockfile"
          git push origin HEAD:chore/security-baseline-2026-09
