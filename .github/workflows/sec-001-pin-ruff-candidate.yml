name: SEC-001 pinned Ruff lock candidate (diagnostic only)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  candidate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Resolve pinned reviewed Ruff and updated security graph
        run: |
          uv lock --upgrade
          sha256sum uv.lock
      - name: Confirm current Trivy HIGH/CRITICAL policy
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
      - name: Retain candidate for reproducible commit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sec001-pinned-ruff-uv-lock
          path: uv.lock
          retention-days: 7
