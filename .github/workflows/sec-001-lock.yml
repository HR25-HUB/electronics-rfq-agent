name: SEC-001 Lock Regeneration

on:
  push:
    branches: [sec-001-restore-security-gate]

permissions:
  contents: write

jobs:
  regenerate-lock:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: sec-001-restore-security-gate

      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Regenerate lock with patched AnyIO
        run: uv lock --upgrade-package anyio

      - name: Verify vulnerable optional dependency is gone
        run: |
          ! grep -q 'name = "crewai"' uv.lock
          ! grep -q 'name = "chromadb"' uv.lock
          python - <<'PY'
          from pathlib import Path

          lines = Path("uv.lock").read_text().splitlines()
          version_text = None
          for index, line in enumerate(lines):
              if line == 'name = "anyio"':
                  for candidate in lines[index + 1:index + 5]:
                      if candidate.startswith('version = "'):
                          version_text = candidate.split('"')[1]
                          break
                  break

          if version_text is None:
              raise SystemExit("anyio not found in uv.lock")

          version = tuple(int(part) for part in version_text.split("."))
          if version < (4, 14, 2):
              raise SystemExit(f"unsafe anyio version: {version_text}")

          print(f"safe anyio version: {version_text}")
          PY

      - name: Commit regenerated lock
        run: |
          if git diff --quiet -- uv.lock; then
            echo "uv.lock already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uv.lock
          git commit -m "security: regenerate lock without vulnerable ChromaDB"
          git push origin HEAD:sec-001-restore-security-gate
