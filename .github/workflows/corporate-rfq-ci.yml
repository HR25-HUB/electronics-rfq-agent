name: Corporate RFQ CI

on:
  pull_request:
    paths:
      - "corporate/**"
      - "AGENTS.md"
      - ".github/copilot-instructions.md"
      - ".github/workflows/corporate-rfq-ci.yml"
  push:
    branches: [main]
    paths:
      - "corporate/**"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install
        working-directory: corporate
        run: uv sync --extra dev
      - name: Ruff format
        working-directory: corporate
        run: uv run ruff format --check .
      - name: Ruff lint
        working-directory: corporate
        run: uv run ruff check .
      - name: Pyrefly
        working-directory: corporate
        run: uv run pyrefly check
      - name: Tests
        working-directory: corporate
        run: uv run pytest
      - name: Golden seed evaluation
        working-directory: corporate
        run: uv run python scripts/evaluate_golden.py tests/golden/seed.jsonl
      - name: Golden RFQ 100 adversarial evaluation
        working-directory: corporate
        run: uv run python scripts/evaluate_golden.py tests/golden/golden100-adversarial.jsonl
