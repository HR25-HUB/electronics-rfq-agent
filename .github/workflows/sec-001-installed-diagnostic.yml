name: SEC-001 installed-environment security diagnostic (temporary)

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  installed-environment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"
      - name: Install actual test environment
        run: uv sync --extra dev --locked
      - name: Scan complete workspace after installation
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
