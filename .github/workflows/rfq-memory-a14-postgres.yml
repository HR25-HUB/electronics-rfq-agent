name: RFQ Memory A1.4 PostgreSQL integration

on:
  pull_request:
    paths:
      - 'experiments/rfq-memory-a12/**'
      - '.github/workflows/rfq-memory-a14-postgres.yml'
  workflow_dispatch:

jobs:
  postgres-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: rfq_test
          POSTGRES_PASSWORD: a14_ci_ephemeral_only
          POSTGRES_DB: rfq_memory_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rfq_test -d rfq_memory_test"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 20
    defaults:
      run:
        working-directory: experiments/rfq-memory-a12
    env:
      PYTHONPATH: src
      RFQ_REQUIRE_POSTGRES: '1'
      RFQ_TEST_POSTGRES_DSN: postgresql://rfq_test:a14_ci_ephemeral_only@localhost:5432/rfq_memory_test
      RFQ_ALLOW_EXTERNAL_LLM: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'pydantic>=2,<3' pytest pytest-asyncio 'psycopg[binary]>=3.2,<4'
      - name: Run required PostgreSQL tests
        shell: bash
        run: |
          set -o pipefail
          python -m pytest -q tests/test_memory.py tests/test_a13.py tests/test_postgres_integration.py 2>&1 | tee evidence/a14-ci-test-output.txt
      - name: Upload evidence log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rfq-memory-a14-postgres-test-output
          path: experiments/rfq-memory-a12/evidence/a14-ci-test-output.txt
          if-no-files-found: warn
