name: REA integration security diagnostic (temporary)
on:
  push:
    branches: [integration/rea-rfq-a124h-sec001]
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Display all blocking findings in both lockfiles
        uses: aquasecurity/trivy-action@c07df6fec6fa692e6fd1200d50aaa1fdd66f03c8
        with:
          scan-type: fs
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
